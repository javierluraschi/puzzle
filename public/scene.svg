<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 336" width="420" height="336">
  <!-- The picture on the landing page's puzzle: lots of nearly uniform sky, like the hard part of a real puzzle. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb0ef"/>
      <stop offset="0.55" stop-color="#8fd0f6"/>
      <stop offset="0.75" stop-color="#cdebf8"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a58bdc"/>
      <stop offset="1" stop-color="#7b5fc4"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="4" rx="34" ry="10" fill="#dcefff"/>
      <circle cx="-16" cy="-2" r="12" fill="#fff"/>
      <circle cx="2" cy="-9" r="16" fill="#fff"/>
      <circle cx="20" cy="-1" r="11" fill="#fff"/>
      <rect x="-30" y="-2" width="60" height="9" rx="4.5" fill="#fff"/>
    </g>
    <g id="balloon">
      <path d="M-7 42L-6 53M7 42L6 53" stroke="#5a4636" stroke-width="1.2"/>
      <rect x="-7.5" y="52" width="15" height="10" rx="2" fill="#9a6a3a"/>
      <rect x="-7.5" y="52" width="15" height="3" rx="1.5" fill="#7a5028"/>
      <path style="fill: var(--env)" d="M0 -46C27 -46 41 -26 38 -4C35 16 16 30 8 42H-8C-16 30 -35 16 -38 -4C-41 -26 -27 -46 0 -46Z"/>
      <path style="fill: var(--band)" d="M0 -46C16 -46 24 -24 22 -2C20 18 10 32 5 42H-5C-10 32 -20 18 -22 -2C-24 -24 -16 -46 0 -46Z"/>
      <path style="fill: var(--env)" d="M0 -46C7 -46 10 -24 9 -2C8 18 4 32 2 42H-2C-4 32 -8 18 -9 -2C-10 -24 -7 -46 0 -46Z"/>
      <path d="M-30 18C-18 24 18 24 30 18L26 25C14 30 -14 30 -26 25Z" style="fill: var(--belt)"/>
      <path d="M-26 -30C-34 -14 -32 6 -22 20" stroke="#fff" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <g id="tree">
      <rect x="-1.5" y="0" width="3" height="9" fill="#6b4a2b"/>
      <circle cx="0" cy="-4" r="7" fill="#2f7d45"/>
      <circle cx="-2" cy="-6" r="3.5" fill="#4a9c5a"/>
    </g>
    <g id="house">
      <rect x="-8" y="-8" width="16" height="11" fill="#fff8ec"/>
      <path d="M-10 -8L0 -16L10 -8Z" fill="#d9533b"/>
      <rect x="-2" y="-4" width="4" height="7" fill="#8a5a3c"/>
      <rect x="-6.5" y="-6" width="3" height="3" fill="#7fb6e0"/>
    </g>
  </defs>

  <rect width="420" height="336" fill="url(#sky)"/>
  <circle cx="346" cy="58" r="40" fill="#fff6c9" opacity="0.45"/>
  <circle cx="346" cy="58" r="22" fill="#fff1a8"/>

  <use href="#cloud" transform="translate(74 58)"/>
  <use href="#cloud" transform="translate(262 34) scale(0.75)"/>
  <use href="#cloud" transform="translate(372 132) scale(0.6)"/>
  <use href="#cloud" transform="translate(168 150) scale(0.5)"/>

  <path d="M196 74q4 -4 8 0q4 -4 8 0M222 64q3 -3 6 0q3 -3 6 0" stroke="#2c4f73" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- colours reach the cloned balloon through inherited custom properties -->
  <use href="#balloon" transform="translate(300 150) scale(0.42)" style="--env: #2f6fde; --band: #ffffff; --belt: #e94f37"/>
  <use href="#balloon" transform="translate(236 104) scale(0.26)" style="--env: #18a596; --band: #ffe9a8; --belt: #0e6f66"/>
  <use href="#balloon" transform="translate(126 112)" style="--env: #e94f37; --band: #ffd25e; --belt: #2f4f8f"/>

  <path d="M0 214C56 196 108 200 158 210C214 222 262 194 320 197C364 199 396 208 420 204V336H0Z" fill="#b5dfa6"/>
  <path d="M0 238C70 218 140 226 202 238C262 250 330 222 420 232V336H0Z" fill="#82c77f"/>

  <use href="#tree" transform="translate(40 228)"/>
  <use href="#tree" transform="translate(52 232) scale(0.8)"/>
  <use href="#tree" transform="translate(372 226)"/>
  <use href="#house" transform="translate(262 236)"/>
  <use href="#house" transform="translate(300 230) scale(1.15)"/>
  <use href="#house" transform="translate(334 234) scale(0.9)"/>
  <g transform="translate(282 232)">
    <rect x="-5" y="-22" width="10" height="25" fill="#fff8ec"/>
    <path d="M-7 -22L0 -36L7 -22Z" fill="#3a5a8f"/>
    <rect x="-2" y="-16" width="4" height="5" rx="2" fill="#7fb6e0"/>
  </g>
  <use href="#tree" transform="translate(246 240) scale(0.9)"/>
  <use href="#tree" transform="translate(352 240) scale(0.85)"/>

  <path d="M0 268C80 250 160 260 230 274C300 288 360 266 420 272V336H0Z" fill="#5aa864"/>
  <path d="M154 336C170 312 196 292 230 280C252 272 264 258 270 246" stroke="#efe0bd" stroke-width="5" fill="none" stroke-linecap="round"/>
  <use href="#tree" transform="translate(110 270) scale(1.3)"/>
  <use href="#tree" transform="translate(130 276) scale(1.1)"/>
  <use href="#tree" transform="translate(396 278) scale(1.2)"/>

  <path d="M0 302C110 288 300 286 420 300V336H0Z" fill="url(#field)"/>
  <g stroke="#6447ad" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M0 310C120 297 300 296 420 309"/>
    <path d="M0 318C120 306 300 305 420 318"/>
    <path d="M0 327C120 315 300 314 420 327"/>
  </g>
  <g fill="#c9b5f2" opacity="0.8">
    <circle cx="30" cy="306" r="1.6"/><circle cx="92" cy="301" r="1.6"/><circle cx="160" cy="297" r="1.6"/><circle cx="238" cy="296" r="1.6"/>
    <circle cx="312" cy="298" r="1.6"/><circle cx="384" cy="303" r="1.6"/><circle cx="60" cy="322" r="1.8"/><circle cx="200" cy="312" r="1.8"/><circle cx="350" cy="316" r="1.8"/>
  </g>
