memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 24M
max_file_uploads = 4
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.enable_cli = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
